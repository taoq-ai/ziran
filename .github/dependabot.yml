# Dependabot scheduled version updates (spec 024, #330).
# Routine grouped updates so the security backlog doesn't silently re-accumulate.
#
# Security updates are NOT configured here — they are a repository setting
# ("Dependabot security updates" / the automated-security-fixes API), separate
# from this file. That setting was off until 2026-07-27, so advisories raised
# alerts but never produced PRs; three high-severity npm advisories accumulated
# behind the grouped updates below and turned the CI dependency-audit gate red
# (#370, #373). It is enabled now. If security PRs stop appearing, check that
# setting first — this file will not tell you about it.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
