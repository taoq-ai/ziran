name: Release

on:
  # Tag push is the primary trigger. release-please creates tags via
  # a PAT (RELEASE_PAT), so the push event triggers this workflow.
  # Tags created by GITHUB_TOKEN would NOT trigger this due to
  # GitHub's anti-cascade rule — that's why a PAT is required.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # stable:  v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+" # alpha:   v1.2.3a1
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+" # beta:    v1.2.3b1
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+" # rc:     v1.2.3rc1
  # Manual trigger for re-releasing missed versions
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.15.0)"
        required: true
        type: string

permissions:
  contents: read

# Prevent concurrent releases of the SAME tag, but allow different tags
# to run in parallel.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Resolve the tag name across trigger types:
#   push (tag)        → github.ref_name
#   workflow_dispatch  → inputs.tag
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ── Gate: tag must be reachable from main ──────────────────────────
  # Prevents publishing from orphaned/detached commits that diverged
  # from main (e.g., force-push after release-please tagged).
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Verify tag is ancestor of main
        run: |
          TAG_SHA=$(git rev-list -n1 "${{ env.RELEASE_TAG }}")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag ${{ env.RELEASE_TAG }} ($TAG_SHA) is NOT reachable from main."
            echo "::error::This likely means the release commit was orphaned by a force-push."
            echo "::error::Delete the tag and re-run release-please from main."
            exit 1
          fi
          echo "✓ Tag ${{ env.RELEASE_TAG }} is reachable from main"

  # ── Gate: full CI must pass before publishing ──────────────────────
  lint:
    needs: [verify-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0  # full history for hatch-vcs

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy ziran/

  test:
    needs: [verify-tag]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0  # full history for hatch-vcs

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group test --extra all

      # the Rego export tests run opa check, parse and eval (spec 107)
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.x

      - name: Run tests
        run: uv run pytest --cov=ziran --cov-report=term-missing -v

  # ── Build sdist + wheel ────────────────────────────────────────────
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0  # full history for hatch-vcs

      # Force hatch-vcs / setuptools-scm to use the tag version.
      # git describe may pick the floating 'v0' tag over 'v0.3.0'
      # when both point to the same commit.
      - name: Pin package version from tag
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(uv run python -c "
          from importlib.metadata import PathDistribution
          from pathlib import Path
          dists = list(Path('dist').glob('ziran-*.tar.gz'))
          # Extract version from filename: ziran-<version>.tar.gz
          name = dists[0].stem  # ziran-<version>.tar
          name = name.rsplit('.', 1)[0]  # ziran-<version>
          print(name.split('-', 1)[1])
          ")
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "Package version: $PKG_VERSION"
          echo "Tag version:     $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — tag=$TAG_VERSION but package=$PKG_VERSION"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

      # CycloneDX SBOM of the locked runtime packages (every extra, no
      # dependency group). Kept out of dist/ so PyPI never sees it.
      - name: Export SBOM
        run: |
          mkdir sbom
          uv export --preview-features sbom-export --format cyclonedx1.5 \
            --frozen --no-default-groups --all-extras > "sbom/ziran-${RELEASE_TAG}.cdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 5

  # ── Attest build provenance and SBOM (Sigstore, GitHub API) ────────
  # Runs no repository or third-party build code: it only downloads the
  # built files and signs them. SECURITY.md shows how to verify them.
  attest:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Sigstore signing certificate
      attestations: write  # store the attestations
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom/*.cdx.json

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/ziran-${{ env.RELEASE_TAG }}.cdx.json

  # ── Publish to PyPI (Trusted Publishing / OIDC) ───────────────────
  # Waits for attest: a failed attestation publishes nothing.
  publish-pypi:
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ziran/
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # ── Publish to TestPyPI (pre-releases only) ────────────────────────
  publish-testpypi:
    if: >-
      contains(github.event.inputs.tag || github.ref_name, 'a')
      || contains(github.event.inputs.tag || github.ref_name, 'b')
      || contains(github.event.inputs.tag || github.ref_name, 'rc')
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ziran/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  # ── Upload artifacts to GitHub Release ─────────────────────────────
  # release-please creates the release, this job updates it with build
  # artifacts. For pre-release tag pushes, it creates a new release.
  github-release:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/

      - name: Determine pre-release flag
        id: prerelease
        run: |
          if echo "${RELEASE_TAG}" | grep -qE '(a|b|rc)[0-9]+$'; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.flag }}
          files: |
            dist/*
            sbom/*.cdx.json

  # ── Update floating major version tag for GitHub Actions ───────────
  # Consumers reference `taoq-ai/ziran@v0` — this tag always points
  # to the latest stable release so they automatically get patches.
  # Uses the GitHub API instead of git push to bypass tag protection rules.
  update-action-tag:
    if: >-
      !contains(github.event.inputs.tag || github.ref_name, 'a')
      && !contains(github.event.inputs.tag || github.ref_name, 'b')
      && !contains(github.event.inputs.tag || github.ref_name, 'rc')
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update floating major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAJOR=$(echo "${RELEASE_TAG}" | grep -oE '^v[0-9]+')
          SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')
          echo "Updating ${MAJOR} → ${SHA} (${RELEASE_TAG})"

          # Try to update existing tag ref; create if it doesn't exist
          if gh api "repos/${{ github.repository }}/git/refs/tags/${MAJOR}" --silent 2>/dev/null; then
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/${MAJOR}" \
              -f sha="${SHA}" -F force=true
          else
            gh api --method POST repos/${{ github.repository }}/git/refs \
              -f ref="refs/tags/${MAJOR}" -f sha="${SHA}"
          fi
