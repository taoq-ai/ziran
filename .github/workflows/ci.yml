name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A docs-only PR skips the work but every required job still reports: a skipped
  # job (or a skipped matrix) leaves its required check pending, so gate by step.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
              | grep -vE '^(docs/|specs/|\.specify/|\.claude/|mkdocs\.yml$|LICENSE)|\.md$' >/dev/null; then
              code=true
            else
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Spec 097: fail a PR whose pyproject.toml no longer matches uv.lock.
      - name: Lockfile check
        if: needs.changes.outputs.code == 'true'
        run: uv lock --check

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: uv sync --frozen --group lint

      - name: Ruff check
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff check .

      - name: Ruff format check
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff format --check .

  typecheck:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: uv sync --frozen --group dev

      - name: Mypy
        if: needs.changes.outputs.code == 'true'
        run: uv run mypy ziran

  dependency-audit:
    # Prevention gate (spec 024, #330): blocks a PR that introduces a new known
    # vulnerability. pip-audit has no native severity filter, so it fails on ANY
    # un-ignored advisory — which matches the "all severities to zero" policy
    # (clarification Q3). Accepted-risk advisories
    # (--ignore-vuln below) mirror the pip rows in docs/security/risk-acceptances.md
    # — keep the two lists in sync.
    # --disable-pip (spec 056): audit the exact exported lock versions without
    # pip re-resolving them; pip rejects the uv mcp override against crewai's pin.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Export full dependency set
        run: >-
          uv export --frozen --no-emit-project --all-extras
          --format requirements-txt -o /tmp/requirements.txt

      - name: Python audit (pip-audit)
        run: >-
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
          --ignore-vuln GHSA-f4j7-r4q5-qw2c
          --ignore-vuln GHSA-w8v5-vhqr-4h9v
          --ignore-vuln GHSA-gr75-jv2w-4656
          --ignore-vuln GHSA-f4xh-w4cj-qxq8
          --ignore-vuln GHSA-36p7-vc44-83pf
          --ignore-vuln GHSA-2wm9-hf6c-p5cr
          --ignore-vuln GHSA-xph7-9rjv-w5fr
