name: Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group test --extra all

      - name: Fetch the base for the prompt immutability test (spec 064)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            echo "ZIRAN_PROMPT_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            echo "ZIRAN_PROMPT_BASE=$BEFORE" >> "$GITHUB_ENV"
          else
            # a new branch has no earlier commit to compare: compare the commit with itself
            echo "ZIRAN_PROMPT_BASE=HEAD" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: >-
          uv run pytest -m "not integration"
          --cov=ziran
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=80
          -v

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  integration-test:
    # ubuntu-latest is ubuntu26.04, which Playwright does not support for chromium (2026-10-29)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies with all extras
        run: uv sync --frozen --group test --extra all

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run integration tests
        run: uv run pytest -m integration -v
