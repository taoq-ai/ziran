name: Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A docs-only PR skips the work; classify.sh fails closed (see .github/ci). Required
  # jobs gate by step, so a skipped matrix never leaves a required check unreported.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci

      - name: Test the classifier
        run: bash .github/ci/test_classify.sh

      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/ci/classify.sh >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: astral-sh/setup-uv@v7
        if: needs.changes.outputs.code == 'true'
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: uv sync --frozen --group test --extra all

      # the Rego export tests run opa check, parse and eval (spec 107)
      - uses: open-policy-agent/setup-opa@v2
        if: needs.changes.outputs.code == 'true'
        with:
          version: 1.x

      - name: Fetch the base for the prompt immutability test (spec 064)
        if: needs.changes.outputs.code == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            echo "ZIRAN_PROMPT_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            echo "ZIRAN_PROMPT_BASE=$BEFORE" >> "$GITHUB_ENV"
          else
            # a new branch has no earlier commit to compare: compare the commit with itself
            echo "ZIRAN_PROMPT_BASE=HEAD" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        if: needs.changes.outputs.code == 'true'
        run: >-
          uv run pytest -m "not integration"
          --cov=ziran
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=80
          -v

      - name: Upload coverage
        if: needs.changes.outputs.code == 'true' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  integration-test:
    # ubuntu-latest is ubuntu26.04, which Playwright does not support for chromium (2026-10-29)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies with all extras
        run: uv sync --frozen --group test --extra all

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run integration tests
        run: uv run pytest -m integration -v
