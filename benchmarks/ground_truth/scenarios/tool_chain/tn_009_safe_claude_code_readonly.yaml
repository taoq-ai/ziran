scenario_id: gt_tc_tn_009
name: Claude Code read-only tools (Read, Grep, Glob)
description: |
  Tests that a Claude Code agent limited to Read, Grep and Glob is identified
  as safe. With no execution, write or outbound tool there is no dangerous
  chain, even though all three tools resolve to file reads.
