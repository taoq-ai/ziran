name: mcp-atlassian 0.22.0 in read-only mode
description: |
  Tests that the same agent on mcp-atlassian 0.22.0 with READ_ONLY_MODE on is
  identified as safe. It can read the attacker's issue but has no upload or
  update tool, so there is no path from issue text to a server file leaving.
