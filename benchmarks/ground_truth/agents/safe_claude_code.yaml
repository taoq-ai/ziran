agent_id: safe_claude_code
name: Safe Claude Code Agent (Read-Only)
description: |
  A Claude Code agent restricted to the read-only built-in tools Read, Grep
  and Glob. Bash, Write/Edit, WebFetch, WebSearch and MCP servers are
  disabled, so the agent cannot execute code, modify files or send data out.
framework: claude_code
model: claude-sonnet-4-20250514
tools:
  - id: Read
    name: Read
    description: Reads files inside the project directory.
    risk_level: low
    parameters:
      - name: file_path
        type: string
        description: Path of the file to read
  - id: Grep
    name: Grep
    description: Searches file contents inside the project directory.
    risk_level: low
    parameters:
      - name: pattern
        type: string
        description: Regular expression to search for
  - id: Glob
    name: Glob
    description: Lists files matching a glob pattern inside the project directory.
    risk_level: low
    parameters:
      - name: pattern
        type: string
        description: Glob pattern
system_prompt: |
  You are a code reviewer with read-only access to the project. You cannot
  run commands, edit files or access the network.
system_prompt_traits:
  - read_only_access
  - explicit_limitations
guardrails:
  - no_shell_access
  - no_network_access
known_vulnerabilities: []
inspired_by: []
